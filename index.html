<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Professional Proofreader App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.1.0/diff.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Lora&family=Playfair+Display:wght@900&family=Pridi:wght@700&family=Sarabun:wght@400;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: Lora; 
            background: #e9ecef; 
            padding: 20px; 
            color: #212529;
        }
        h2 { 
            text-align: center; 
            color: #343a40; 
            font-family: 'Playfair Display';
        }
        .container { 
            display: flex; 
            gap: 20px; 
            margin-bottom: 20px; 
        }
        .box { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
        }
        label {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #495057;
        }
        textarea { 
            width: 100%; 
            height: 250px; 
            padding: 12px; 
            font-size: 16px; 
            border: 1px solid #ced4da; 
            border-radius: 8px; 
            resize: vertical; 
            box-sizing: border-box;
            line-height: 1.6;
            font-family: Lora;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }
        button { 
            padding: 12px 25px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            transition: all 0.3s; 
            box-shadow: 0 4px 6px #0000001a;
        }
        .btn-proofread {
            background: #0d6efd; 
        }
        .btn-proofread:hover { 
            background: #0b5ed7; 
        }
        .btn-nyt {
            background: #212529; 
            font-family: 'Playfair Display';
        }
        .btn-nyt:hover {
            background: #f8f9fa;
            color: #212529;
            border: 1px solid #212529;
        }
        .btn-thai {
            background: #b91d1d;
            font-family: 'Sarabun';
        }
        .btn-thai:hover {
            background: #f8f9fa;
            color: #b91d1d;
            border: 1px solid #b91d1d;
        }
        .result-container { 
            background: white; 
            padding: 40px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px #0000000d; 
            min-height: 200px; 
            font-size: 18px; 
            line-height: 2; 
            white-space: pre-wrap;
            display: block; 
        }
        del { 
            text-decoration: line-through; 
            color: #dc3545; 
            background: #f8d7da; 
            padding: 2px 4px; 
            border-radius: 4px; 
        }
        ins { 
            text-decoration: none; 
            color: #198754; 
            background: #d1e7dd; 
            padding: 2px 4px; 
            border-bottom: 2px dashed #198754; 
            font-weight: bold; 
        }
        .newspaper-container {
            background: #fdfbf7; 
            padding: 40px 60px;
            border: 1px solid #dee2e6;
            box-shadow: 0 10px 30px #0000001a;
            display: none; 
            max-width: 1000px;
            margin: 0 auto;
            color: #212529;
        }
        .nyt-header {
            text-align: center;
            font-family: 'UnifrakturMaguntia';
            font-size: 70px;
            color: #212529;
            margin-bottom: 10px;
            line-height: 1;
        }
        .nyt-date-line {
            font-family: Lora;
            font-size: 12px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #212529;
            border-bottom: 2px solid #212529;
            padding: 8px 0;
            margin-bottom: 35px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .nyt-title {
            font-family: 'Playfair Display';
            font-size: 52px;
            font-weight: 900;
            line-height: 1.1;
            text-align: left;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .nyt-author {
            font-family: Lora;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 30px;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 10px;
        }
        .nyt-content {
            font-family: Lora;
            font-size: 16px;
            line-height: 1.7;
            column-count: 3; 
            column-gap: 40px;
            column-rule: 1px solid #dee2e6;
            text-align: justify; 
        }
        .nyt-content p {
            margin-top: 0;
            margin-bottom: 1.2em;
            text-indent: 2em; 
        }
        .lang-en .nyt-content p:first-of-type::first-letter {
            font-size: 4.5em;
            float: left;
            line-height: 0.8;
            margin-right: 10px;
            margin-top: 5px;
            font-family: 'Playfair Display';
            font-weight: 900;
        }
        
        /* สไตล์สำหรับหนังสือพิมพ์ภาษาไทย */
        .lang-th .nyt-header {
            font-family: 'Chonburi';
            font-size: 65px;
        }
        .lang-th .nyt-date-line {
            font-family: 'Sarabun';
            font-size: 14px;
        }
        .lang-th .nyt-title {
            font-family: 'Pridi';
        }
        .lang-th .nyt-author {
            font-family: 'Sarabun';
        }
        .lang-th .nyt-content {
            font-family: 'Sarabun';
            font-size: 18px;
        }
        .lang-th .nyt-content p:first-of-type::first-letter {
            font-size: 3.5em;
            float: left;
            line-height: 1;
            margin-right: 8px;
            font-family: 'Pridi';
            font-weight: 700;
        }
    </style>
</head>
<body>

    <h2>Professional Proofreader App</h2>

    <div class="container">
        <div class="box">
            <label for="draft">Draft</label>
            <textarea id="draft" placeholder="Paste draft text here..."></textarea>
        </div>
        <div class="box">
            <label for="final">Final</label>
            <textarea id="final" placeholder="Paste final text here..."></textarea>
        </div>
    </div>
    
    <div class="btn-group">
        <button class="btn-proofread" onclick="compareTexts()">Show Proofread Marks</button>
        <button class="btn-nyt" onclick="generateNewspaper('en')">Read as English Newspaper</button>
        <button class="btn-thai" onclick="generateNewspaper('th')">อ่านแบบหนังสือพิมพ์ไทย</button>
    </div>

    <div class="result-container" id="result-proofread">
        <em>Comparison results will be displayed here...</em>
    </div>

    <div class="newspaper-container lang-en" id="result-newspaper">
        <div class="nyt-header">The Global Times</div>
        <div class="nyt-date-line"></div>
        <div class="nyt-title" id="nyt-title-display">LATEST UPDATES</div>
        <div class="nyt-author">By THE EDITORIAL BOARD</div>
        <div class="nyt-content" id="nyt-body">
            <em>Newspaper content will be displayed here...</em>
        </div>
    </div>

    <script>
        function compareTexts() {
            const draft = document.getElementById('draft').value;
            const final = document.getElementById('final').value;
            const resultDiv = document.getElementById('result-proofread');
            const newspaperDiv = document.getElementById('result-newspaper');

            if (!draft && !final) {
                alert('Please enter text in both fields');
                return;
            }

            newspaperDiv.style.display = 'none';
            resultDiv.style.display = 'block';

            const c = String.fromCharCode(44);
            const code = 'Diff.diffWords(draft' + c + ' final)';
            const diff = eval(code);
            
            resultDiv.innerHTML = '';
            const fragment = document.createDocumentFragment();

            diff.forEach((part) => {
                const span = document.createElement(part.added ? 'ins' : part.removed ? 'del' : 'span');
                const lines = part.value.split('\n');
                
                for (let i = 0; i < lines.length; i++) {
                    span.appendChild(document.createTextNode(lines[i]));
                    if (i < lines.length - 1) {
                        span.appendChild(document.createElement('br'));
                    }
                }
                
                fragment.appendChild(span);
            });

            resultDiv.appendChild(fragment);
        }

        function generateNewspaper(lang) {
            const final = document.getElementById('final').value;
            const resultDiv = document.getElementById('result-proofread');
            const newspaperDiv = document.getElementById('result-newspaper');
            const contentDiv = document.getElementById('nyt-body');
            const titleDiv = document.getElementById('nyt-title-display');
            const dateLineDiv = document.querySelector('.nyt-date-line');
            const headerDiv = document.querySelector('.nyt-header');
            const authorDiv = document.querySelector('.nyt-author');

            if (!final) {
                alert('Please enter text in the Final box');
                return;
            }

            resultDiv.style.display = 'none';
            newspaperDiv.style.display = 'block';

            if (lang === 'th') {
                newspaperDiv.classList.add('lang-th');
                newspaperDiv.classList.remove('lang-en');
                headerDiv.innerText = 'เดอะ สยาม ไทมส์';
                authorDiv.innerText = 'โดย กองบรรณาธิการ';
            } else {
                newspaperDiv.classList.add('lang-en');
                newspaperDiv.classList.remove('lang-th');
                headerDiv.innerText = 'The Global Times';
                authorDiv.innerText = 'By THE EDITORIAL BOARD';
            }

            const paragraphs = final.split(/\n+/).filter(p => p.trim() !== '');
            
            if (paragraphs.length >= 1) {
                titleDiv.innerText = paragraphs[0];
            }

            if (paragraphs.length === 1) {
                contentDiv.innerHTML = '<p>No additional content provided.</p>';
            } else {
                const bodyPars = paragraphs.slice(1);
                contentDiv.innerHTML = bodyPars.map(p => '<p>' + p + '</p>').join('');
            }

            const now = new Date();
            const hour = now.getHours();
            const dateNum = now.getDate();
            const year = now.getFullYear();
            const monthIdx = now.getMonth();
            const dayIdx = now.getDay();

            const enDays = 'SUNDAY MONDAY TUESDAY WEDNESDAY THURSDAY FRIDAY SATURDAY'.split(' ');
            const thDays = 'อาทิตย์ จันทร์ อังคาร พุธ พฤหัสบดี ศุกร์ เสาร์'.split(' ');
            
            const enMonths = 'JANUARY FEBRUARY MARCH APRIL MAY JUNE JULY AUGUST SEPTEMBER OCTOBER NOVEMBER DECEMBER'.split(' ');
            const thMonths = 'มกราคม กุมภาพันธ์ มีนาคม เมษายน พฤษภาคม มิถุนายน กรกฎาคม สิงหาคม กันยายน ตุลาคม พฤศจิกายน ธันวาคม'.split(' ');

            const issueNo = (monthIdx + 1) * 10000 + dateNum * 100 + hour;

            let dateHTML = '';

            if (lang === 'th') {
                const thYear = year + 543;
                const dName = thDays[dayIdx];
                const mName = thMonths[monthIdx];
                
                const span1 = '<span>ปีที่ ' + (year - 2020) + ' ฉบับที่ ' + issueNo + '</span>';
                const span2 = '<span>วัน' + dName + 'ที่ ' + dateNum + ' ' + mName + ' พ.ศ. ' + thYear + '</span>';
                const span3 = '<span>ราคา 15 บาท</span>';
                
                dateHTML = span1 + span2 + span3;
            } else {
                const dName = enDays[dayIdx];
                const mName = enMonths[monthIdx];
                
                let volNum = year - 1851;
                let volRoman = '';
                
                while (volNum >= 1000) { volRoman += 'M'; volNum -= 1000; }
                while (volNum >= 900) { volRoman += 'CM'; volNum -= 900; }
                while (volNum >= 500) { volRoman += 'D'; volNum -= 500; }
                while (volNum >= 400) { volRoman += 'CD'; volNum -= 400; }
                while (volNum >= 100) { volRoman += 'C'; volNum -= 100; }
                while (volNum >= 90) { volRoman += 'XC'; volNum -= 90; }
                while (volNum >= 50) { volRoman += 'L'; volNum -= 50; }
                while (volNum >= 40) { volRoman += 'XL'; volNum -= 40; }
                while (volNum >= 10) { volRoman += 'X'; volNum -= 10; }
                while (volNum >= 9) { volRoman += 'IX'; volNum -= 9; }
                while (volNum >= 5) { volRoman += 'V'; volNum -= 5; }
                while (volNum >= 4) { volRoman += 'IV'; volNum -= 4; }
                while (volNum >= 1) { volRoman += 'I'; volNum -= 1; }

                const span1 = '<span>VOL. ' + volRoman + '... No. ' + issueNo + '</span>';
                const span2 = '<span>NEW YORK ' + dName + ' ' + mName + ' ' + dateNum + ' ' + year + '</span>';
                const span3 = '<span>$3.00</span>';
                
                dateHTML = span1 + span2 + span3;
            }

            dateLineDiv.innerHTML = dateHTML;
        }
    </script>

</body>
</html>
